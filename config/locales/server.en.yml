en:
  site_settings:
    isbf_pinning_enabled: "Enable native topic pinning guards and home-feed ordering."
    isbf_pinning_home_actions_enabled: "Allow developers to create or change home-feed pins."
    isbf_pinning_official_category_id: "Actual official category for the home Official feed. Zero disables the Official scope."
    isbf_pinning_bar_appearance: "Independent light and dark appearance for the home pinned bar. Use the pinned bar appearance editor on this page."
    isbf_pinning_bar_default_topic_id: "Topic shown in the collapsed pinned bar. Zero uses the first accessible active pin; unavailable topics also fall back to it."
    isbf_pinning_bar_light_desktop_image: "Light desktop pinned bar background. PNG, WebP or JPEG, up to 5 MB."
    isbf_pinning_bar_light_mobile_image: "Light mobile background. An empty value uses the light desktop image."
    isbf_pinning_bar_dark_desktop_image: "Dark desktop pinned bar background. PNG, WebP or JPEG, up to 5 MB."
    isbf_pinning_bar_dark_mobile_image: "Dark mobile background. An empty value uses the dark desktop image."
  isbf_pinning:
    future_required: "Choose a future date and time for the pin to expire."
    unavailable: "This topic cannot be pinned to the home feed."
    invalid: "Invalid pinning request."
    invalid_appearance: "Use a complete light and dark configuration, eight-digit hex colors, a 0–4 px border in 0.5 px steps, and valid background positioning."
    invalid_background: "Choose a public PNG, WebP or JPEG no larger than 5 MB, 8192 px per edge and 16 megapixels. Only developers may upload pinned bar backgrounds."
